[project]
name = "winecap"
version = "0.1.0"
description = "Capture, review, and normalize Windows installer changes in Wine prefixes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pefile>=2023.2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
winecap = "winecap.cli:main"
normalize-reg = "winecap.normalizer_cli:main"
scan-pe = "winecap.pe_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winecap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
